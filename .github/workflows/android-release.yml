name: Flutter CI
on:
  push:
    branches: [main, master, develop, "cursor/*", "codex/*"]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  PUB_HOSTED_URL: https://pub.dev
  FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read and validate VERSION
        id: version
        run: python3 scripts/read-version.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - name: Test version reader
        run: python3 -m unittest discover -s test/ci -p 'test_*.py'
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Compile Android integration for pull requests
        if: github.event_name == 'pull_request'
        env:
          STUDY_VERSION: ${{ steps.version.outputs.version }}
        run: flutter build apk --debug --build-name "$STUDY_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Read and validate VERSION
        id: version
        run: python3 scripts/read-version.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - name: Restore fixed release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bash scripts/prepare-signing.sh
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - name: Build the version from VERSION
        env:
          STUDY_VERSION: ${{ steps.version.outputs.version }}
        run: flutter build apk --release --build-name "$STUDY_VERSION" --build-number "$(($(date +%s) - 1577836800))"
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties android/signing/study-release.jks
