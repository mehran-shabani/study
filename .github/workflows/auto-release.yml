name: Auto Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PUB_HOSTED_URL: https://pub.dev
  FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com

jobs:
  tag-release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read and validate VERSION
        id: version
        run: python3 scripts/read-version.py

      - name: Test version reader
        run: python3 -m unittest discover -s test/ci -p 'test_*.py'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.2'

      - name: Build release APK
        shell: bash
        env:
          STUDY_VERSION: ${{ steps.version.outputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          bash scripts/prepare-signing.sh
          flutter pub get --enforce-lockfile
          flutter gen-l10n
          flutter build apk --release --build-name "$STUDY_VERSION" --build-number "$(($(date +%s) - 1577836800))"

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: CHANGELOG.md
          files: build/app/outputs/flutter-apk/app-release.apk
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties android/signing/study-release.jks
